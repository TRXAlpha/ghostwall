# Ghostwall + AdGuard Home on any Docker host: a VM, a NAS, a mini PC or a Pi.
#
#   docker compose up -d --build
#
# 1. Open http://<host>:3000 and finish AdGuard's setup (keep its query log on).
# 2. About 10 s later, restart AdGuard once so it picks up the faster log setting
#    (docker compose logs adguard-tune says when it is set):
#      docker compose restart adguardhome
# 3. Point your router's DNS (or one test device) at <host>.
# 4. Dashboard: http://<host>:8088, user ghostwall, password from:
#      docker compose exec ghostwall cat /data/web_password
#
# Already run AdGuard Home or Pi-hole in Docker? Use only the ghostwall service and
# mount your existing folders instead (README.md, "Docker").
services:
  adguardhome:
    # Pinned (tag and digest); bump deliberately after reading AdGuard's release notes.
    image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    restart: unless-stopped
    ports:
      - "${DNS_PORT:-53}:53/tcp"
      - "${DNS_PORT:-53}:53/udp"
      - "3000:3000/tcp"   # setup wizard (and the admin UI if you keep port 3000)
      - "8080:80/tcp"     # the admin UI if you choose port 80 in the wizard
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf

  ghostwall:
    build: .
    image: ghostwall:local
    restart: unless-stopped
    depends_on: [adguardhome]
    ports:
      - "8088:8088"
    environment:
      GHOSTWALL_QUERYLOG: /adguard/work/data/querylog.json
      # Let AdGuard block with Ghostwall's threat feed (off by default; try dry-run first, then
      # `docker compose exec ghostwall ghostwall blocking`). Needs AdGuard's admin login:
      #   DNS_BLOCK_FEED: dry-run          # off | dry-run | on
      #   DNS_BLOCK_ADS: pro               # off | pro | ultimate
      #   ADGUARD_USER: admin              # the login you made in AdGuard's setup
      #   ADGUARD_PASSWORD: choose-yours
      DNS_BLOCK_FEED: ${DNS_BLOCK_FEED:-off}
      DNS_BLOCK_ADS: ${DNS_BLOCK_ADS:-off}
      DNS_BLOCK_BYPASS: ${DNS_BLOCK_BYPASS:-off}
      DNS_BLOCK_CANARIES: ${DNS_BLOCK_CANARIES:-on}
      DNS_PROTECTIVE_UPSTREAM: ${DNS_PROTECTIVE_UPSTREAM:-off}
      ADGUARD_URL: ${ADGUARD_URL:-http://adguardhome:3000}   # port 80 if you chose that in the wizard
      ADGUARD_USER: ${ADGUARD_USER:-}
      ADGUARD_PASSWORD: ${ADGUARD_PASSWORD:-}
      # AdGuard fetches the list from Ghostwall over the compose network (the port is not published).
      DNS_BLOCK_BIND: 0.0.0.0
      DNS_BLOCK_URL: http://ghostwall:5382/ghostwall-blocklist.txt
      # GHOSTWALL_WEB_PASSWORD: choose-one   # default: generated once into /data/web_password
    # Root inside the container (to read AdGuard's root-owned log) but with no capabilities,
    # a read-only filesystem and no way to gain privileges. It sees AdGuard's files
    # read-only and never its config: the dashboard listens on the network, and a bug
    # there must not be able to change where your DNS goes.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    # No capabilities: AdGuard's image runs as root, and root may read what root owns.
    # Running AdGuard as another user (`user:` in its service)? Then add
    # cap_add: [DAC_OVERRIDE] here; the container says so when it can't read the log.
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./adguard/work:/adguard/work:ro
      - ./ghostwall-data:/data

  # Lowers AdGuard's query-log buffer (1000 queries by default) so alerts arrive in
  # seconds. The only part that can write AdGuard's config: no network, nothing mounted
  # but that folder, and it runs nothing but adguard_conf.py. Its two capabilities let it
  # edit the file whoever owns it, and keep that owner (AdGuard may run as a normal user).
  adguard-tune:
    image: ghostwall:local
    restart: unless-stopped
    depends_on: [ghostwall]
    command: ["tune-adguard"]
    healthcheck:
      disable: true       # the image's check probes ghost-dns, which this service doesn't run
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./adguard/conf:/adguard/conf
