# Project metadata only. Ghostwall is installed with install.sh or Docker, not pip.
[project]
name = "ghostwall"
version = "0.3.0b4"
description = "Spots infected devices on a home network from their DNS lookups, next to AdGuard Home or Pi-hole. Local-first."
readme = "README.md"
license = "MIT"
authors = [{ name = "Morogan Christian" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "onnxruntime>=1.16,<2"]

[project.urls]
Homepage = "https://github.com/TRXAlpha/ghostwall"
Issues = "https://github.com/TRXAlpha/ghostwall/issues"
