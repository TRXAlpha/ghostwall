name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.10", "3.13", "3.14"]   # 3.14: Ubuntu 26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --require-hashes -r requirements.lock
      - name: tests
        run: |
          for d in agents/ghost_dns/tests agents/ghost_flow/tests agents/fw_bot/tests agents/capture/tests agents/web_ui/tests; do
            python -m unittest discover -s "$d" || exit 1
          done
          python agents/netconf/test_gen.py
      - name: shell scripts parse
        run: for f in install.sh uninstall.sh agents/ghost_dns/go_shadow.sh docker/entrypoint.sh tests/installer_e2e.sh tests/gateway_e2e.sh; do bash -n "$f"; done

  lint:
    # Undefined names, unused imports, code that can never run: a test class written after
    # `unittest.main()` once passed CI for weeks without ever running.
    name: lint (pyflakes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r tests/requirements-lint.txt
      - run: python -m pyflakes agents ghostwall tests trm

  installer:
    # install.sh for real, under systemd, as a user would run it. (Before this job, a
    # Python 3.12-only line made every fresh install on Debian 12 / Ubuntu 22.04 fail.)
    name: installer (${{ matrix.image }}, systemd)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Debian 13 is what current Raspberry Pi OS is built on; Ubuntu 26.04 is the newest LTS.
        image: ["debian:bookworm", "debian:trixie", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: tests/installer_e2e.sh "${{ matrix.image }}"

  gateway:
    # ghost-flow on a real kernel queue and capture with real tcpdump, in network namespaces.
    name: gateway mode (ghost-flow + capture)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: tests/gateway_e2e.sh

  docker:
    name: docker image (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: docker build -t ghostwall:ci .
      - name: smoke test (locked down as in compose.yaml, no capabilities; follows a fake AdGuard log, scores a query, dashboard needs the password)
        run: |
          mkdir -p work/data data
          : > work/data/querylog.json
          # as AdGuard's image leaves them: root-owned, 0700 / 0600; data/ as Docker creates it
          sudo chown -R root:root work data && sudo chmod 700 work/data && sudo chmod 600 work/data/querylog.json
          docker run -d --name gw -p 8088:8088 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/work:/adguard/work:ro" -v "$PWD/data:/data" ghostwall:ci
          test "$(docker exec gw grep CapEff /proc/1/status | cut -f2)" = 0000000000000000
          queries() { docker exec gw python -c "import json,urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:5380/status'))['stats']['queries'])"; }
          for i in $(seq 60); do queries >/dev/null 2>&1 && break; sleep 1; done
          echo '{"T":"2026-10-31T12:00:00Z","QH":"kjqwehdzxklqwpe.biz","QT":"A","IP":"192.168.1.9"}' | sudo tee -a work/data/querylog.json >/dev/null
          for i in $(seq 30); do [ "$(queries)" = 1 ] && break; sleep 1; done
          docker exec gw python -c "import json,urllib.request; s=json.load(urllib.request.urlopen('http://127.0.0.1:5380/status')); print(s); assert s['shadow'] and s['stats']['queries'] == 1"
          grep kjqwehdzxklqwpe.biz data/events.jsonl
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/)" = 301      # plain HTTP -> HTTPS
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:8088/)" = 401
          PASS=$(sudo cat data/web_password)
          test "$(curl -sk -o /dev/null -w '%{http_code}' -u "ghostwall:$PASS" https://127.0.0.1:8088/api/events)" = 200
          if docker logs gw 2>&1 | grep -qF "$PASS"; then echo "password leaked into the logs"; exit 1; fi
          docker exec gw ghostwall status | grep -q "1 queries"
      - name: a log owned by another user (AdGuard run as non-root) is reported, not silently unread
        run: |
          mkdir -p other/data otherdata && : > other/data/querylog.json
          sudo chown -R 1234:1234 other && sudo chmod 600 other/data/querylog.json && sudo chown root:root otherdata
          docker run -d --name gw2 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/other:/adguard/work:ro" -v "$PWD/otherdata:/data" ghostwall:ci
          for i in $(seq 30); do docker logs gw2 2>&1 | grep -q "cap_add: \[DAC_OVERRIDE\]" && break; sleep 1; done
          docker logs gw2 2>&1 | grep "can't read /adguard/work/data/querylog.json"
      - name: Telegram alerts in the container (as `ghostwall telegram` sets them up; Telegram answers only late)
        run: |
          printf 'FW_BOT_TELEGRAM_TOKEN=123456:EXAMPLE-not-a-real-token-xyz\nFW_BOT_CALLBACK_SECRET=%s\nFW_BOT_TELEGRAM_API=http://127.0.0.1:18080\n' \
            "$(openssl rand -hex 32)" | sudo tee data/fw_bot.env >/dev/null
          echo '{"chat_id": 4242}' | sudo tee data/owner.json >/dev/null
          docker restart gw
          for i in $(seq 60); do docker exec gw python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5380/status')" 2>/dev/null && break; sleep 1; done
          sleep 2
          echo '{"T":"2026-10-31T12:05:00Z","QH":"zqxwvkjhgfdsplm.biz","QT":"A","IP":"192.168.1.9"}' | sudo tee -a work/data/querylog.json >/dev/null
          sleep 4   # the alert is written while Telegram is still unreachable
          FAKE=$(cat <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def reply(self, result):
                  b = json.dumps({"ok": True, "result": result}).encode()
                  self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
              def do_GET(self):
                  __import__("time").sleep(1); self.reply([])
              def do_POST(self):
                  body = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))) or b"{}")
                  if self.path.endswith("/sendMessage"):
                      open("/tmp/sent.jsonl", "a").write(json.dumps(body) + "\n")
                      return self.reply({"message_id": 1})
                  self.reply(True)
          HTTPServer(("127.0.0.1", 18080), H).serve_forever()
          PY
          )
          docker exec -d gw python -c "$FAKE"
          for i in $(seq 60); do docker exec gw grep -q zqxwvkjhgfdsplm.biz /tmp/sent.jsonl 2>/dev/null && break; sleep 1; done
          docker exec gw grep zqxwvkjhgfdsplm.biz /tmp/sent.jsonl
          docker logs gw 2>&1 | grep -q "Telegram alerts on"
          if docker logs gw 2>&1 | grep -q "EXAMPLE-not-a-real-token"; then echo "bot token in the logs"; exit 1; fi
      - name: adguard-tune sidecar (no network, as in compose.yaml) lowers AdGuard's buffer and keeps the file's owner
        run: |
          mkdir -p conf
          printf 'dns:\n  port: 53\nquerylog:\n  enabled: true\n  size_memory: 1000\n' > conf/AdGuardHome.yaml
          chmod 600 conf/AdGuardHome.yaml   # owned by the runner user, like AdGuard run as a normal user
          docker run -d --name tune --network none --read-only --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE \
            --security-opt no-new-privileges -v "$PWD/conf:/adguard/conf" ghostwall:ci tune-adguard
          for i in $(seq 20); do grep -q 'size_memory: 10$' conf/AdGuardHome.yaml && break; sleep 1; done
          grep -q 'size_memory: 10$' conf/AdGuardHome.yaml
          test "$(stat -c %u:%a conf/AdGuardHome.yaml)" = "$(id -u):600"
          docker logs tune
      - if: failure()
        run: docker logs gw; docker logs gw2 || true; docker logs tune || true
