name: release

# Publishes a GitHub release whose notes are that version's section of CHANGELOG.md; a
# version with a "-" (beta, rc) is a pre-release. Two ways in:
#  - push a version tag (v0.3.0-beta.1, ...);
#  - or run this workflow by hand on main with the version: it tags main's head itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to release from main's head, e.g. v0.3.0-beta.1 (creates the tag)"
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: release from the CHANGELOG section of this version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$' || { echo "not a version: $TAG"; exit 1; }
          awk -v h="## $TAG " 'index($0, h) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## $TAG ' section"; exit 1; }
          pre=""; case "$TAG" in *-*) pre="--prerelease" ;; esac
          if [ "$EVENT" = push ]; then
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag $pre
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA" $pre
          fi
